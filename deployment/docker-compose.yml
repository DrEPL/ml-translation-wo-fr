services:
  translation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nllb-translation-api
    ports:
      - "5000:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      PYTHONUNBUFFERED: "1"

      # --- MLflow Model Registry (DagsHub) ---
      MLFLOW_TRACKING_URI: "https://dagshub.com/DrEPL/ml-translation-wo-fr.mlflow"
      MLFLOW_MODEL_URI: "models:/nllb-fr-wo-translation/latest"

      # Jeton DagsHub — à injecter depuis un fichier .env ou secret CI/CD
      # Ne jamais commiter la valeur réelle ici !
      DAGSHUB_USER_TOKEN: "${DAGSHUB_USER_TOKEN}"

      # Chemin local (fallback si MLflow inaccessible)
      MODEL_PATH: /app/model

    volumes:
      # Monte le dossier local 'model/' comme fallback hors-ligne
      - ./model:/app/model
    networks:
      - translation-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  translation-network:
    driver: bridge
